<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&display=swap">
  <style>
    body { margin: 0; font-family: "Zen Kaku Gothic New", -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; }
    a { color: #4338ca; } a:hover { color: #3730a3; }
    .num { font-variant-numeric: tabular-nums; }
    .label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.22em; color: #a29d95; }
  </style>
</helmet>
<div style="width: 390px; min-height: 880px; position: relative; background: #fbfaf8; color: #17181a; box-sizing: border-box; overflow: hidden">
  <div style="padding: 30px 24px 110px; display: flex; flex-direction: column">

    <div style="display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 18px; border-bottom: 2px solid #17181a">
      <span>
        <span class="label" style="display: block">共同購入</span>
        <span style="display: block; margin-top: 4px; font-size: 26px; font-weight: 900; line-height: 1">ホーム</span>
      </span>
      <span style="text-align: right">
        <span style="display: block; font-size: 14px; font-weight: 700">主催 太郎</span>
        <span style="display: block; margin-top: 1px; font-size: 11.5px; color: #a29d95">&#64;owner001</span>
      </span>
    </div>

    <div style="padding: 20px 0 8px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <span class="label">やること</span>
        <span class="num" style="font-size: 12px; font-weight: 700; color: #4338ca">3件</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #e5e2dc">
        <span style="width: 6px; height: 6px; border-radius: 999px; background: #b91c1c; flex-shrink: 0"></span>
        <span style="min-width: 0; flex: 1 1 0%">
          <span style="display: block; font-size: 14.5px; font-weight: 700">支払う</span>
          <span style="display: block; margin-top: 1px; font-size: 12px; color: #78736c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">責任 花子 さんへ <span class="num" style="font-weight: 700; color: #17181a">¥1,800</span></span>
        </span>
        <svg style="width: 16px; height: 16px; color: #c6c1b8; flex-shrink: 0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #e5e2dc">
        <span style="width: 6px; height: 6px; border-radius: 999px; background: #b45309; flex-shrink: 0"></span>
        <span style="min-width: 0; flex: 1 1 0%">
          <span style="display: block; font-size: 14.5px; font-weight: 700">購入希望を入力</span>
          <span style="display: block; margin-top: 1px; font-size: 12px; color: #78736c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">コミックマーケット105・受付中</span>
        </span>
        <svg style="width: 16px; height: 16px; color: #c6c1b8; flex-shrink: 0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #e5e2dc">
        <span style="width: 6px; height: 6px; border-radius: 999px; background: #4338ca; flex-shrink: 0"></span>
        <span style="min-width: 0; flex: 1 1 0%">
          <span style="display: block; font-size: 14.5px; font-weight: 700">承認に投票</span>
          <span style="display: block; margin-top: 1px; font-size: 12px; color: #78736c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">イベントの確定・賛成あと1票</span>
        </span>
        <svg style="width: 16px; height: 16px; color: #c6c1b8; flex-shrink: 0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </div>
    </div>

    <div style="padding: 20px 0 8px">
      <span class="label" style="display: block">未精算のまとめ</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 6px">
        <span style="padding: 12px 0; border-bottom: 1px solid #e5e2dc">
          <span style="display: block; font-size: 12px; color: #78736c">支払う</span>
          <span class="num" style="display: block; margin-top: 2px; font-size: 30px; font-weight: 300; letter-spacing: -0.02em">¥1,800</span>
        </span>
        <span style="padding: 12px 0 12px 20px; border-bottom: 1px solid #e5e2dc; border-left: 1px solid #e5e2dc">
          <span style="display: block; font-size: 12px; color: #78736c">受け取る</span>
          <span class="num" style="display: block; margin-top: 2px; font-size: 30px; font-weight: 300; letter-spacing: -0.02em; color: #a29d95">¥0</span>
        </span>
      </div>
      <span style="display: inline-block; margin-top: 10px; font-size: 12px; font-weight: 700; color: #4338ca; border-bottom: 1px solid #4338ca; padding-bottom: 1px">くわしく見る</span>
    </div>

    <div style="padding: 20px 0 8px">
      <span class="label" style="display: block">進行中のイベント</span>
      <div style="padding: 14px 0; border-bottom: 1px solid #e5e2dc">
        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px">
          <span style="min-width: 0">
            <span style="display: block; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">コミックマーケット105</span>
            <span style="display: block; margin-top: 2px; font-size: 12px; color: #78736c">東京ビッグサイト・12/30（火）</span>
          </span>
          <span style="font-size: 12px; font-weight: 700; color: #4338ca; border-bottom: 1px solid #4338ca; white-space: nowrap; flex-shrink: 0">受付中</span>
        </div>
        <p class="num" style="margin: 10px 0 0; font-size: 11px; color: #a29d95; letter-spacing: 0.04em">準備中 ── <span style="color: #17181a; font-weight: 700">受付中</span> ── 確定済 ── 開催中 ── 精算中 ── 完了</p>
      </div>
    </div>

    <div style="padding: 20px 0 0">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <span class="label">参加中のグループ</span>
        <span style="font-size: 12px; font-weight: 700; color: #4338ca">＋ 新規作成</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #e5e2dc">
        <span style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 1px solid #17181a; color: #17181a; font-size: 15px; font-weight: 700; flex-shrink: 0; box-sizing: border-box">買</span>
        <span style="min-width: 0; flex: 1 1 0%">
          <span style="display: block; font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">買い物仲間の会</span>
          <span style="display: block; margin-top: 1px; font-size: 12px; color: #78736c">メンバー 4人</span>
        </span>
        <span style="font-size: 11px; font-weight: 700; color: #78736c; border: 1px solid #d6d2ca; padding: 3px 8px; white-space: nowrap; flex-shrink: 0">最高責任者</span>
      </div>
    </div>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; background: #fbfaf8; border-top: 1px solid #e5e2dc; display: flex; padding: 10px 8px 24px">
    <span style="flex: 1 1 0%; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg style="width: 22px; height: 22px; color: #17181a" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5L12 3l9 7.5M5 9.5V20h14V9.5"/></svg>
      <span style="font-size: 10px; font-weight: 700; color: #17181a">ホーム</span>
      <span style="width: 4px; height: 4px; border-radius: 999px; background: #4338ca"></span>
    </span>
    <span style="flex: 1 1 0%; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg style="width: 22px; height: 22px; color: #a29d95" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.4"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-1a4 4 0 00-3-3.87M9 20H2v-1a4 4 0 013-3.87m10.5-4.13a3 3 0 11-6 0 3 3 0 016 0zM19 8a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0zM10 8a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0zM16 20H8v-1a4 4 0 018 0v1z"/></svg>
      <span style="font-size: 10px; font-weight: 500; color: #a29d95">グループ</span>
      <span style="width: 4px; height: 4px"></span>
    </span>
    <span style="flex: 1 1 0%; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <span style="position: relative; display: inline-flex">
        <svg style="width: 22px; height: 22px; color: #a29d95" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.4"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
        <span class="num" style="position: absolute; top: -5px; right: -8px; font-size: 10px; font-weight: 900; color: #b91c1c">3</span>
      </span>
      <span style="font-size: 10px; font-weight: 500; color: #a29d95">お知らせ</span>
      <span style="width: 4px; height: 4px"></span>
    </span>
    <span style="flex: 1 1 0%; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg style="width: 22px; height: 22px; color: #a29d95" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.4"><path stroke-linecap="round" stroke-linejoin="round" d="M5.5 20a6.5 6.5 0 0113 0M15 8a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      <span style="font-size: 10px; font-weight: 500; color: #a29d95">アカウント</span>
      <span style="width: 4px; height: 4px"></span>
    </span>
  </nav>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
