<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans JP", -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; }
    a { color: #c9ef5a; } a:hover { color: #daf78a; }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  </style>
</helmet>
<div style="width: 390px; min-height: 880px; position: relative; background: #0b0d10; color: #e8ecf1; box-sizing: border-box; overflow: hidden">
  <div style="padding: 20px 20px 120px; display: flex; flex-direction: column; gap: 18px">

    <div style="display: flex; align-items: center; gap: 10px">
      <span style="display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 10px; background: #c9ef5a; color: #16200a; font-size: 15px; font-weight: 700">共</span>
      <h1 style="margin: 0; font-size: 17px; font-weight: 700; flex: 1 1 0%">ホーム</h1>
      <span style="display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 999px; background: #15181d; border: 1px solid #262b33; color: #8b94a1; font-size: 13px; font-weight: 700; box-sizing: border-box">太</span>
    </div>

    <div style="background: #15181d; border: 1px solid #262b33; border-radius: 16px; padding: 16px; box-sizing: border-box">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #8b94a1">次のイベント</span>
        <span style="display: inline-flex; align-items: center; border-radius: 6px; border: 1px solid #c9ef5a; color: #c9ef5a; font-size: 11px; font-weight: 700; padding: 2px 8px">受付中</span>
      </div>
      <p style="margin: 8px 0 0; font-size: 18px; font-weight: 700; line-height: 1.3">コミックマーケット105</p>
      <p style="margin: 4px 0 0; font-size: 12.5px; color: #8b94a1">東京ビッグサイト・12/30（火）</p>
      <div style="margin-top: 14px; display: flex; align-items: center; gap: 4px">
        <span style="height: 4px; flex: 1 1 0%; background: #c9ef5a"></span>
        <span style="height: 4px; flex: 1 1 0%; background: #c9ef5a"></span>
        <span style="height: 4px; flex: 1 1 0%; background: #262b33"></span>
        <span style="height: 4px; flex: 1 1 0%; background: #262b33"></span>
        <span style="height: 4px; flex: 1 1 0%; background: #262b33"></span>
        <span style="height: 4px; flex: 1 1 0%; background: #262b33"></span>
      </div>
      <p style="margin: 6px 0 0; font-size: 11px; color: #8b94a1">準備中 → <span style="color: #c9ef5a; font-weight: 700">受付中</span> → 確定済 → 開催中 → 精算中 → 完了</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 8px; padding: 0 2px">
        <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #8b94a1">やること</h2>
        <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; border-radius: 6px; background: #c9ef5a; color: #16200a; font-size: 11px; font-weight: 700; padding: 0 5px">3</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; background: #15181d; border: 1px solid #3a2228; border-left: 3px solid #fb7185; border-radius: 12px; padding: 13px 14px; box-sizing: border-box">
        <span style="min-width: 0; flex: 1 1 0%">
          <span style="display: block; font-size: 14px; font-weight: 700">支払う</span>
          <span style="display: block; margin-top: 2px; font-size: 12px; color: #8b94a1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">責任 花子 さんへ <span class="num" style="color: #fb7185; font-weight: 700">¥1,800</span></span>
        </span>
        <svg style="width: 16px; height: 16px; color: #4a515c; flex-shrink: 0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; background: #15181d; border: 1px solid #3a3222; border-left: 3px solid #fbbf24; border-radius: 12px; padding: 13px 14px; box-sizing: border-box">
        <span style="min-width: 0; flex: 1 1 0%">
          <span style="display: block; font-size: 14px; font-weight: 700">購入希望を入力</span>
          <span style="display: block; margin-top: 2px; font-size: 12px; color: #8b94a1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">コミックマーケット105・受付中</span>
        </span>
        <svg style="width: 16px; height: 16px; color: #4a515c; flex-shrink: 0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; background: #15181d; border: 1px solid #263a2e; border-left: 3px solid #34d399; border-radius: 12px; padding: 13px 14px; box-sizing: border-box">
        <span style="min-width: 0; flex: 1 1 0%">
          <span style="display: block; font-size: 14px; font-weight: 700">承認に投票</span>
          <span style="display: block; margin-top: 2px; font-size: 12px; color: #8b94a1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">イベントの確定・賛成あと1票</span>
        </span>
        <svg style="width: 16px; height: 16px; color: #4a515c; flex-shrink: 0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #8b94a1; padding: 0 2px">未精算のまとめ</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <span style="display: flex; flex-direction: column; gap: 4px; background: #15181d; border: 1px solid #262b33; border-radius: 12px; padding: 14px; box-sizing: border-box">
          <span style="font-size: 11px; font-weight: 600; color: #8b94a1">支払う</span>
          <span class="num" style="font-size: 24px; font-weight: 700; color: #fb7185">¥1,800</span>
        </span>
        <span style="display: flex; flex-direction: column; gap: 4px; background: #15181d; border: 1px solid #262b33; border-radius: 12px; padding: 14px; box-sizing: border-box">
          <span style="font-size: 11px; font-weight: 600; color: #8b94a1">受け取る</span>
          <span class="num" style="font-size: 24px; font-weight: 700; color: #34d399">¥0</span>
        </span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 2px">
        <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #8b94a1">参加中のグループ</h2>
        <span style="font-size: 12px; font-weight: 700; color: #c9ef5a">＋ 新規作成</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; background: #15181d; border: 1px solid #262b33; border-radius: 12px; padding: 13px 14px; box-sizing: border-box">
        <span style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 10px; background: #1c2027; border: 1px solid #262b33; color: #8b94a1; font-size: 15px; font-weight: 700; flex-shrink: 0; box-sizing: border-box">買</span>
        <span style="min-width: 0; flex: 1 1 0%">
          <span style="display: block; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">買い物仲間の会</span>
          <span style="display: block; margin-top: 1px; font-size: 12px; color: #8b94a1">メンバー 4人</span>
        </span>
        <span style="display: inline-flex; align-items: center; border-radius: 6px; border: 1px solid #c9ef5a; color: #c9ef5a; font-size: 10.5px; font-weight: 700; padding: 2px 8px; white-space: nowrap; flex-shrink: 0">最高責任者</span>
      </div>
    </div>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; background: #0f1114; border-top: 1px solid #262b33; display: flex; align-items: flex-end; padding: 8px 8px 22px">
    <span style="flex: 1 1 0%; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0">
      <svg style="width: 22px; height: 22px; color: #e8ecf1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5L12 3l9 7.5M5 9.5V20h14V9.5"/></svg>
      <span style="font-size: 10px; font-weight: 700; color: #e8ecf1">ホーム</span>
    </span>
    <span style="flex: 1 1 0%; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0">
      <svg style="width: 22px; height: 22px; color: #8b94a1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-1a4 4 0 00-3-3.87M9 20H2v-1a4 4 0 013-3.87m10.5-4.13a3 3 0 11-6 0 3 3 0 016 0zM19 8a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0zM10 8a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0zM16 20H8v-1a4 4 0 018 0v1z"/></svg>
      <span style="font-size: 10px; font-weight: 500; color: #8b94a1">グループ</span>
    </span>
    <span style="flex: 1 1 0%; display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: -26px">
      <span style="display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 999px; background: #c9ef5a; color: #16200a; box-shadow: 0 6px 20px rgba(201,239,90,0.35)">
        <svg style="width: 26px; height: 26px" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l2.4 12.2a2 2 0 002 1.8h7.9a2 2 0 002-1.6L21 7H6"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg>
      </span>
      <span style="font-size: 10px; font-weight: 700; color: #c9ef5a">当日</span>
    </span>
    <span style="flex: 1 1 0%; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0">
      <span style="position: relative; display: inline-flex">
        <svg style="width: 22px; height: 22px; color: #8b94a1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
        <span style="position: absolute; top: -4px; right: -6px; display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; border-radius: 999px; background: #fb7185; color: #0b0d10; font-size: 9px; font-weight: 700">3</span>
      </span>
      <span style="font-size: 10px; font-weight: 500; color: #8b94a1">お知らせ</span>
    </span>
    <span style="flex: 1 1 0%; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0">
      <svg style="width: 22px; height: 22px; color: #8b94a1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M5.5 20a6.5 6.5 0 0113 0M15 8a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      <span style="font-size: 10px; font-weight: 500; color: #8b94a1">アカウント</span>
    </span>
  </nav>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
