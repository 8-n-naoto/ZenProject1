<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>オフラインです - コミケ共同購入管理</title>
    <link rel="stylesheet" href="/css/app.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0284c7">
</head>
<body class="bg-slate-100 text-slate-900">
    <main class="mx-auto max-w-3xl px-3 pt-20">
        <div class="rounded-2xl bg-white px-4 py-8 text-center shadow-sm">
            <p class="text-4xl">📶</p>
            <h1 class="mt-3 text-base font-semibold">オフラインです</h1>
            <p class="mt-2 text-sm text-slate-500">
                通信できないため、このページを表示できませんでした。<br>
                電波の良い場所で、もう一度お試しください。
            </p>
            <button type="button" onclick="location.reload()"
                    class="mt-5 inline-flex min-h-11 items-center justify-center rounded-xl bg-sky-600 px-4 py-2 text-sm font-semibold text-white">
                再読み込み
            </button>
        </div>

        <!-- 直前に開いていた買い物リストがあれば、読み取り専用で見せる -->
        <div id="cached" class="mt-4 hidden">
            <div class="rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3 text-xs text-amber-900">
                <p class="font-semibold">最後に取得した買い物リストです</p>
                <p class="mt-1">
                    <span id="cached-saved-at"></span> 時点の内容です。
                    ここからは記録できません。電波が戻ってから登録してください。
                </p>
            </div>

            <div class="mt-3 rounded-2xl bg-white px-4 py-3 shadow-sm">
                <p id="cached-event" class="text-sm font-semibold"></p>
                <p id="cached-progress" class="mt-0.5 text-xs text-slate-500"></p>
                <p id="cached-budget" class="mt-0.5 text-xs"></p>
            </div>

            <div id="cached-circles" class="mt-3 space-y-2"></div>
        </div>
    </main>

    <script>
    (function () {
        var raw = null;

        try { raw = window.sessionStorage.getItem('shopping-snapshot'); } catch (e) { raw = null; }

        if (!raw) { return; }

        var data;
        try { data = JSON.parse(raw); } catch (e) { return; }
        if (!data || !data.circles) { return; }

        function text(id, value) {
            var node = document.getElementById(id);
            if (node) { node.textContent = value; }
        }

        text('cached-saved-at', data.savedAt || '');
        text('cached-event', data.event || '');

        if (data.progress) {
            text('cached-progress', '進捗 ' + data.progress.done + ' / ' + data.progress.total + ' 件');
        }

        var budgetNode = document.getElementById('cached-budget');
        if (budgetNode && data.budget) {
            var over = data.budget.isOver;
            var amount = Math.abs(data.budget.remaining).toLocaleString('ja-JP');
            budgetNode.textContent = '残り ' + (over ? '\u2212¥' : '¥') + amount;
            budgetNode.className = 'mt-0.5 text-xs font-semibold ' + (over ? 'text-rose-700' : 'text-emerald-600');
        }

        var list = document.getElementById('cached-circles');

        data.circles.forEach(function (circle, index) {
            var section = document.createElement('section');
            section.className = 'rounded-2xl bg-white px-4 py-3 shadow-sm' + (circle.done ? ' opacity-60' : '');

            var heading = document.createElement('p');
            heading.className = 'text-sm font-semibold';
            heading.textContent = (index + 1) + '. ' + (circle.name || '');
            section.appendChild(heading);

            var booth = document.createElement('p');
            booth.className = 'mt-0.5 text-xs font-semibold text-sky-700';
            booth.textContent = circle.booth || '';
            section.appendChild(booth);

            (circle.items || []).forEach(function (item) {
                var row = document.createElement('p');
                row.className = 'mt-1 text-xs ' + (item.done ? 'text-slate-400 line-through' : 'text-slate-600');
                row.textContent = (item.name || '') + ' × ' + (item.quantity || 0) + '点';
                section.appendChild(row);
            });

            list.appendChild(section);
        });

        document.getElementById('cached').classList.remove('hidden');
    })();
    </script>
</body>
</html>
